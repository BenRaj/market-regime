<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}market-regime{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <span class="brand">📊 market-regime</span>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Aujourd'hui</a>
      <a href="/history" class="{% if request.url.path == '/history' %}active{% endif %}">Historique</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/main.js"></script>
</body>
</html>
